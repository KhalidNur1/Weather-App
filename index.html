<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      margin: 100px auto;
      text-align: center;
      background: linear-gradient(180deg, #87CEEB 0%, #b8e4f9 100%);
      color: #1a3a5c;
      min-height: 100vh;
    }
    .cloud {
      position: fixed;
      background: white;
      border-radius: 50px;
      opacity: 0.8;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud1 { width: 200px; height: 60px; top: 10%; left: 5%; animation: drift 20s infinite linear; }
    .cloud1::before { width: 100px; height: 80px; top: -40px; left: 20px; }
    .cloud1::after { width: 80px; height: 60px; top: -30px; left: 90px; }
    .cloud2 { width: 150px; height: 45px; top: 20%; right: 5%; animation: drift 28s infinite linear; }
    .cloud2::before { width: 80px; height: 60px; top: -30px; left: 15px; }
    .cloud2::after { width: 60px; height: 50px; top: -20px; right: 15px; }
    .cloud3 { width: 180px; height: 50px; top: 5%; left: 40%; animation: drift 24s infinite linear; }
    .cloud3::before { width: 90px; height: 70px; top: -35px; left: 20px; }
    .cloud3::after { width: 70px; height: 55px; top: -25px; left: 80px; }
    @keyframes drift {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(110vw); }
    }
    h1 { font-size: 2.5rem; color: #1a3a5c; margin-bottom: 30px; }
    input {
      padding: 12px;
      font-size: 16px;
      border-radius: 25px;
      border: 2px solid #1a3a5c;
      width: 220px;
      outline: none;
      background: rgba(255,255,255,0.7);
      color: #1a3a5c;
    }
    button {
      background: #1a3a5c;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin-left: 8px;
    }
    button:hover { background: #2a5a8c; }
    #result {
      margin-top: 40px;
      font-size: 20px;
      line-height: 2;
      background: rgba(255,255,255,0.5);
      border-radius: 20px;
      padding: 20px;
    }
    #temp { font-size: 70px; font-weight: bold; color: #1a3a5c; }
  </style>
</head>
<body>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <h1>🌤️ Weather App</h1>
  <input id="city" placeholder="Enter a city..." />
  <button onclick="getWeather()">Search</button>
  <div id="result"></div>

  <script>
    const API_KEY = "2134bd66991ee74b0276290bae662402";

    async function getWeather() {
      const city = document.getElementById("city").value;
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

      const response = await fetch(url);
      const data = await response.json();

      if (data.cod !== 200) {
        document.getElementById("result").innerHTML = "❌ City not found!";
        return;
      }

      document.getElementById("result").innerHTML = `
        <p>${data.name}, ${data.sys.country}</p>
        <p id="temp">${Math.round(data.main.temp)}°C</p>
        <p>${data.weather[0].description}</p>
        <p>💧 Humidity: ${data.main.humidity}%</p>
        <p>💨 Wind: ${data.wind.speed} m/s</p>
      `;
    }
  </script>
</body>
</html>
